<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-labelledby="title description">
  <title id="title">Anti-BLA — In response to BLA</title>
  <desc id="description">A dark green banner with the Anti-BLA name and a diagram connecting preserved original bytes, a bounded inspection view, and evidence.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d18"/><stop offset="1" stop-color="#08100d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#93f5bb"/><stop offset="1" stop-color="#48c99a"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#88c9a7" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1440" height="420" rx="22" fill="url(#background)"/>
  <rect width="1440" height="420" rx="22" fill="url(#grid)"/>
  <path d="M0 419H1440" stroke="url(#accent)" stroke-width="3"/>
  <g font-family="Segoe UI,Inter,Arial,sans-serif">
    <rect x="58" y="43" width="168" height="29" rx="14.5" fill="#93f5bb" fill-opacity=".1" stroke="#93f5bb" stroke-opacity=".3"/>
    <circle cx="75" cy="57.5" r="4" fill="#93f5bb"/>
    <text x="88" y="62" fill="#b4efc9" font-size="12" font-weight="600" letter-spacing="1.5">RESEARCH / v0.1</text>
    <text x="54" y="174" fill="#f0f7f2" font-size="90" font-weight="750" letter-spacing="-4">Anti-BLA</text>
    <text x="59" y="232" fill="#9af1bc" font-size="34" font-weight="500" letter-spacing="-.6">In response to BLA.</text>
    <text x="60" y="283" fill="#a1b5a9" font-size="19">Preserve the original. Follow the evidence.</text>
    <g font-size="12" font-weight="600" letter-spacing="1.4" fill="#c2d3c8">
      <rect x="60" y="322" width="63" height="31" rx="6" fill="#1c3025"/><text x="78" y="342">CLI</text>
      <rect x="133" y="322" width="73" height="31" rx="6" fill="#1c3025"/><text x="150" y="342">MCP</text>
      <rect x="216" y="322" width="132" height="31" rx="6" fill="#1c3025"/><text x="232" y="342">AGENT SKILL</text>
    </g>
    <rect x="835" y="44" width="545" height="322" rx="16" fill="#102019" stroke="#2d4838"/>
    <circle cx="859" cy="67" r="3.5" fill="#93f5bb"/><circle cx="872" cy="67" r="3.5" fill="#4c715c"/><circle cx="885" cy="67" r="3.5" fill="#345240"/>
    <text x="1354" y="72" text-anchor="end" fill="#799b88" font-size="11" letter-spacing="2">FOLLOW THE BYTES</text>
    <path d="M836 86H1379" stroke="#263e30"/>
    <g font-family="Consolas,monospace">
      <text x="861" y="119" fill="#799b88" font-size="11" letter-spacing="1.2">01 / ORIGINAL ARTIFACT</text>
      <rect x="861" y="133" width="492" height="39" rx="6" fill="#0b1610" stroke="#2a4032"/>
      <text x="878" y="158" fill="#c2d3c8" font-size="15">bytes preserved</text><text x="1337" y="157" text-anchor="end" fill="#80c49b" font-size="12">SHA-256</text>
      <path d="M1107 179V192m-5-5 5 5 5-5" fill="none" stroke="#6aae83" stroke-width="1.5"/>
      <text x="861" y="216" fill="#799b88" font-size="11" letter-spacing="1.2">02 / BOUNDED INSPECTION</text>
      <rect x="861" y="229" width="492" height="39" rx="6" fill="#173224" stroke="#5f9a75"/>
      <text x="878" y="254" fill="#c6f7d7" font-size="15">selected facts + exact source ranges</text>
      <path d="M1107 275V288m-5-5 5 5 5-5" fill="none" stroke="#6aae83" stroke-width="1.5"/>
      <rect x="861" y="301" width="492" height="39" rx="6" fill="#0b1610" stroke="#2a4032"/>
      <text x="878" y="326" fill="#c2d3c8" font-size="14">03 / REA HANDOFF + EVIDENCE</text><circle cx="1335" cy="320" r="4" fill="#93f5bb"/>
    </g>
  </g>
</svg>
